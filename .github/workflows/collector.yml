name: Collector

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  collector:
    runs-on: ubuntu-latest
    name: Types, lint, tests and build

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the committed bundle is current
        run: git diff --exit-code resources/dist
